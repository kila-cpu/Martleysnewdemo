<script>
  // Desktop preview: scale the 393×852 phone to fit the window, and keep the status-bar clock live.
  (function () {
    function fit() { var s = Math.min(1, (window.innerHeight - 48) / 878); document.documentElement.style.setProperty("--s", Math.max(.55, s).toFixed(3)); }
    function clock() { var d = new Date(); document.getElementById("sbtime").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
    fit(); clock(); window.addEventListener("resize", fit); setInterval(clock, 20000);
  })();
</script>
